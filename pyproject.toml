[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "controlbench"
version = "0.1.0"
description = "Experiment validation and benchmarking for the MATLAB DMPC framework"
requires-python = ">=3.12"
dependencies = ["numpy>=1.26", "PyYAML>=6", "matplotlib>=3.8"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.9", "mypy>=1.14", "types-PyYAML"]

[project.scripts]
controlbench = "controlbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
ignore_missing_imports = true
