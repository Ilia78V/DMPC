experiment: {name: tanks_smoke}
controller:
  horizon_steps: 3
  admm: {max_iterations: 60, convergence_tolerance: 0.001}
scenario: {duration_s: 0.2}
requirements:
  - {id: state_bounds, metric: state_violation_count, operator: le, limit: 0}
  - {id: input_bounds, metric: input_violation_count, operator: le, limit: 0}
  - {id: successful_solves, metric: failed_local_solves, operator: le, limit: 0}
